# Deployed by Komodo. No ports are published to the host: the `cloudflared`
# connector below dials out to Cloudflare and reaches `web` over the `edge`
# network, so nothing is exposed directly (CLAUDE.md constraint 2).
#
# Secrets are Komodo variables and never live in this repo.
services:
  web:
    image: ${WEB_IMAGE:-wingate-associates:latest}
    # Built on the host, never pulled: there is no registry image, and Komodo
    # runs `docker compose pull` first, which fails for a build-only image.
    pull_policy: build
    build:
      context: .
      args:
        NEXT_PUBLIC_PLAUSIBLE_SRC: ${NEXT_PUBLIC_PLAUSIBLE_SRC:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL}
      # Public booking page embedded on /contact. Empty until Cal.diy is set up.
      BOOKING_URL: ${BOOKING_URL:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [edge, internal]

  # Cloudflare Tunnel connector. Remote-managed: the public hostname
  # (https://wingate.associates -> http://web:3000) is set in the Cloudflare
  # dashboard, and only the token lives here as a Komodo variable. It shares
  # the `edge` network with `web` and cannot reach `db`.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    networks: [edge]

  # Self-hosted booking (ADR-006): Cal.diy, the open-source edition. It runs the
  # official image pinned to a release, on the same Postgres server but with its
  # own database and role. Public hostname: https://${CAL_HOST} -> http://cal:3000
  # in the Cloudflare dashboard. The public URL is applied at start-up (the image
  # rewrites its built-in placeholder), so no image build is needed.
  cal:
    image: calcom/cal.diy:${CAL_VERSION:-v6.2.0}
    restart: unless-stopped
    environment:
      DATABASE_HOST: db:5432
      DATABASE_URL: postgresql://cal:${CAL_DB_PASSWORD:?set CAL_DB_PASSWORD}@db:5432/cal
      DATABASE_DIRECT_URL: postgresql://cal:${CAL_DB_PASSWORD}@db:5432/cal
      NEXT_PUBLIC_WEBAPP_URL: https://${CAL_HOST:?set CAL_HOST}
      NEXTAUTH_URL: https://${CAL_HOST}
      ALLOWED_HOSTNAMES: '"${CAL_HOST}"'
      NEXTAUTH_SECRET: ${CAL_NEXTAUTH_SECRET:?set CAL_NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CAL_ENCRYPTION_KEY:?set CAL_ENCRYPTION_KEY}
      # No usage reporting (CLAUDE.md constraints 4 and 5) and no public sign-up.
      CALCOM_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DISABLE_SIGNUP: "true"
      # Booking emails go out through Resend's SMTP relay (ADR-003).
      EMAIL_FROM: ${CAL_EMAIL_FROM:-notifications@wingate.associates}
      EMAIL_FROM_NAME: Wingate Associates
      EMAIL_SERVER_HOST: smtp.resend.com
      EMAIL_SERVER_PORT: "587"
      EMAIL_SERVER_USER: resend
      EMAIL_SERVER_PASSWORD: ${RESEND_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      cal-db-init:
        condition: service_completed_successfully
    networks: [edge, internal]

  # Creates Cal.diy's role and database on the shared Postgres, then exits. Safe
  # to run on every deploy. A new `db` volume only creates POSTGRES_DB, so this
  # is what gives Cal.diy its own database on an existing one.
  cal-db-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      CAL_DB_PASSWORD: ${CAL_DB_PASSWORD}
    command:
      - sh
      - -c
      - |
        psql -v ON_ERROR_STOP=1 -v pw="$$CAL_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE cal LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'cal') \gexec
        SELECT format('ALTER ROLE cal PASSWORD %L', :'pw') \gexec
        SELECT 'CREATE DATABASE cal OWNER cal' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'cal') \gexec
        SQL
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # Applies migrations on each deploy, then exits. `web` waits for it to succeed.
  migrate:
    image: ${MIGRATE_IMAGE:-wingate-associates-migrate:latest}
    pull_policy: build
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

volumes:
  db-data:

networks:
  # `web`, `cal` and `cloudflared` only.
  edge:
  internal:
