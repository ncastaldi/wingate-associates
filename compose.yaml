# Deployed by Komodo. No ports are published to the host: the Cloudflare Tunnel
# connector reaches `web` over the `edge` network, so nothing is exposed
# directly (CLAUDE.md constraint 2).
#
# Secrets are Komodo variables and never live in this repo. Cal.com is a later
# addition (ADR-006).
services:
  web:
    image: ${WEB_IMAGE:-wingate-associates:latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_PLAUSIBLE_SRC: ${NEXT_PUBLIC_PLAUSIBLE_SRC:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL}
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, internal]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

volumes:
  db-data:

networks:
  # Shared with the cloudflared connector; create it once on the target host.
  edge:
    external: true
  internal:
