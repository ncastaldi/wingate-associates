<!-- @dsCard group="Brand" viewport="700x300" name="Logo" subtitle="Full lockup, header mark, and the dark-mode badge" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../preview/theme.css">
<style>
body{background:var(--bg);background-image:none;min-height:0;display:block;margin:0;padding:20px 24px}
.k{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.pane{padding:16px 18px;border-radius:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0}
.g{display:grid;grid-template-columns:1.3fr 1fr;gap:0;height:260px}.g>div{display:grid;place-items:center;gap:10px;padding:16px}.full img{width:220px}.marks{display:flex;gap:28px;align-items:center}.marks img{width:72px}.hdr{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}.hdr img{width:32px}
</style>
</head>
<body>
<div class="g"><div data-theme="light" class="full"><img src="../assets/wingate-logo.png" alt="Wingate Associates logo"><div class="hdr"><img src="../assets/wingate-mark.png" alt="">Wingate Associates</div></div><div data-theme="dark"><div class="marks"><img src="../assets/wingate-mark-badge.png" alt=""><img src="../assets/wingate-wordmark-reversed.png" alt="" style="width:130px"></div><div class="hdr"><img src="../assets/wingate-mark-badge.png" alt="">Wingate Associates</div><span class="k">Dark: badge on paper disc</span></div></div>
</body>
</html>
