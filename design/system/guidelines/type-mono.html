<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../preview/theme.css">
<style>
body{background:var(--bg);background-image:none;min-height:0;display:block;margin:0;padding:20px 24px}
.k{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.pane{padding:16px 18px;border-radius:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0}
.r{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--border)}
</style>
</head>
<body>
<div class="r"><span class="k">Mono label<br>13 / +0.06em</span><span style="font-family:var(--font-mono);font-size:var(--text-mono);letter-spacing:var(--tracking-mono);text-transform:uppercase">01 &nbsp; HR &nbsp; AD &nbsp; Entra ID &nbsp; <span data-status="critical">1 mismatch</span></span></div>
<div class="r"><span class="k">Mono inline<br>0.9em</span><span>Every call is logged with <code>tool.invoke</code> and the caller.</span></div>
</body>
</html>
