<!-- @dsCard group="Colors" viewport="700x150" name="Brand constants" subtitle="Navy, teal, slate and paper sampled from the logo" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../preview/theme.css">
<style>
body{background:var(--bg);background-image:none;min-height:0;display:block;margin:0;padding:20px 24px}
.k{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.pane{padding:16px 18px;border-radius:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{height:64px;border-radius:2px;border:1px solid rgba(0,0,0,.08)}.n{font-size:13px;font-weight:600;margin-top:8px}
</style>
</head>
<body>
<div class="row"><div><div class="c" style="background:#0e2745"></div><div class="n">Navy</div><div class="k">--wa-navy · #0e2745</div></div><div><div class="c" style="background:#296e7b"></div><div class="n">Teal</div><div class="k">--wa-teal · #296e7b</div></div><div><div class="c" style="background:#75838e"></div><div class="n">Slate</div><div class="k">--wa-slate · #75838e</div></div><div><div class="c" style="background:#f6f6f2"></div><div class="n">Paper</div><div class="k">--wa-paper · #f6f6f2</div></div></div>
</body>
</html>
