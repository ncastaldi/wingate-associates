<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../preview/theme.css">
<style>
body{background:var(--bg);background-image:none;min-height:0;display:block;margin:0;padding:20px 24px}
.k{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.pane{padding:16px 18px;border-radius:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0}
.f{display:grid;grid-template-columns:1fr 1fr;gap:20px}.f>div{border-top:1.5px solid var(--text);padding-top:12px}.big{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1}.m{font-family:var(--font-mono);font-size:36px;line-height:1}.d{font-size:13px;color:var(--text-muted);margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="f"><div><div class="big">Aa 24→7</div><div class="d"><b style="color:var(--text)">Instrument Sans</b> · variable 400–700<br>SIL Open Font License 1.1<br><span class="k">fonts/InstrumentSans-Variable.woff2</span></div></div><div><div class="m">Aa 5.05</div><div class="d"><b style="color:var(--text)">IBM Plex Mono</b> · 400, 500<br>SIL Open Font License 1.1<br><span class="k">fonts/IBMPlexMono-400/500.woff2</span></div></div></div>
</body>
</html>
