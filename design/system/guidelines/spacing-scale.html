<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="4px base, ten steps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../preview/theme.css">
<style>
body{background:var(--bg);background-image:none;min-height:0;display:block;margin:0;padding:20px 24px}
.k{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.pane{padding:16px 18px;border-radius:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0}
.s{display:flex;align-items:flex-end;gap:14px}.s>div{display:grid;gap:6px;justify-items:start}.b{background:var(--accent);height:14px}
</style>
</head>
<body>
<div class="s"><div><div class="b" style="width:3.4px"></div><span class="k">1<br>4</span></div><div><div class="b" style="width:6.8px"></div><span class="k">2<br>8</span></div><div><div class="b" style="width:10.2px"></div><span class="k">3<br>12</span></div><div><div class="b" style="width:13.6px"></div><span class="k">4<br>16</span></div><div><div class="b" style="width:20.4px"></div><span class="k">5<br>24</span></div><div><div class="b" style="width:27.2px"></div><span class="k">6<br>32</span></div><div><div class="b" style="width:40.8px"></div><span class="k">7<br>48</span></div><div><div class="b" style="width:54.4px"></div><span class="k">8<br>64</span></div><div><div class="b" style="width:81.6px"></div><span class="k">9<br>96</span></div><div><div class="b" style="width:108.8px"></div><span class="k">10<br>128</span></div></div>
</body>
</html>
