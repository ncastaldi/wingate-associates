<!-- @dsCard group="Colors" viewport="700x310" name="Surfaces, text and lines" subtitle="Neutral tokens in light and dark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../preview/theme.css">
<style>
body{background:var(--bg);background-image:none;min-height:0;display:block;margin:0;padding:20px 24px}
.k{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.pane{padding:16px 18px;border-radius:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0}
.s{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}.s i{width:22px;height:22px;border-radius:2px;border:1px solid var(--border)}.s b{font-family:var(--font-mono);font-weight:400;font-size:12px}.pane .k:first-child{margin-bottom:6px;display:block}
</style>
</head>
<body>
<div class="duo"><div class="pane" data-theme="light"><span class="k">Light</span><div class="s"><i style="background:#f6f6f2"></i><b>--bg</b><span class="k">#f6f6f2</span></div><div class="s"><i style="background:#ffffff"></i><b>--surface</b><span class="k">#ffffff</span></div><div class="s"><i style="background:#ecede7"></i><b>--surface-sunken</b><span class="k">#ecede7</span></div><div class="s"><i style="background:#0e2745"></i><b>--text</b><span class="k">#0e2745</span></div><div class="s"><i style="background:#4b5a6b"></i><b>--text-muted</b><span class="k">#4b5a6b</span></div><div class="s"><i style="background:#d6d9d6"></i><b>--border</b><span class="k">#d6d9d6</span></div><div class="s"><i style="background:#8a96a1"></i><b>--border-strong</b><span class="k">#8a96a1</span></div></div><div class="pane" data-theme="dark"><span class="k">Dark</span><div class="s"><i style="background:#0b1420"></i><b>--bg</b><span class="k">#0b1420</span></div><div class="s"><i style="background:#111c2a"></i><b>--surface</b><span class="k">#111c2a</span></div><div class="s"><i style="background:#08101a"></i><b>--surface-sunken</b><span class="k">#08101a</span></div><div class="s"><i style="background:#e7ecf0"></i><b>--text</b><span class="k">#e7ecf0</span></div><div class="s"><i style="background:#9cabb9"></i><b>--text-muted</b><span class="k">#9cabb9</span></div><div class="s"><i style="background:#22324a"></i><b>--border</b><span class="k">#22324a</span></div><div class="s"><i style="background:#5a6b80"></i><b>--border-strong</b><span class="k">#5a6b80</span></div></div></div>
</body>
</html>
