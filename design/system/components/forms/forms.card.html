<!-- @dsCard group="Components" viewport="700x880" name="Contact form" subtitle="Fields, errors, sending, success, form-level and rate-limit errors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../preview/theme.css">
<link rel="stylesheet" href="../../preview/states.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{background:var(--bg);background-image:none;min-height:0;display:block;margin:0}
.k{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.duo{display:grid;grid-template-columns:1fr 1fr}.duo>div{padding:18px 20px;min-width:0}
.st{display:grid;gap:10px;align-content:start}
form{max-width:none}.g{display:grid;grid-template-columns:1fr 1fr;gap:0}.g>div{padding:18px 20px;display:grid;gap:18px;align-content:start}textarea{min-height:80px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Field, ContactForm } = window.WingateAssociatesDesignSystem_495635;
function Card(){return (<div className="g"><div data-theme="light"><div className="st"><form noValidate onSubmit={e=>e.preventDefault()} style={{gap:14}}><div><label htmlFor="a">Name</label><input id="a" defaultValue="" /></div><div><label htmlFor="b">Email · hover</label><input id="b" data-demo="hover" defaultValue="dana@" /></div><div><label htmlFor="c">Message · focus</label><textarea id="c" data-demo="focus" rows="2" style={{minHeight:64}} defaultValue="Our queue has 400 open tickets." /></div><Field label="Email" name="e1" type="email" error="Enter a valid email" defaultValue="dana@" /><Field label="Name" name="n1" disabled defaultValue="Disabled" /></form></div><span className="k">Invalid</span><ContactForm state="invalid" /></div><div data-theme="dark"><span className="k">Sending</span><ContactForm state="sending" /><span className="k">Form-level error</span><div style={{display:'grid',gap:10}}><form><p role="alert">Something went wrong. Please try again.</p></form><form><p role="alert">Too many messages have been sent recently. Please try again in an hour.</p></form></div><span className="k">Success</span><ContactForm state="success" /></div></div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body>
</html>
