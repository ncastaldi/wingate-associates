version: 2

updates:
  # GitHub Actions — keeps the actions pinned in .github/workflows/ current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"

  # Lint/test tooling for the scripts under .claude/skills/, pinned in
  # requirements-dev.txt, so a ruff or pytest bump arrives as a reviewable PR
  # rather than silently changing what CI enforces. Not the application stack.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "tooling"

  # The application: npm dependencies in package.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  # Base images in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
